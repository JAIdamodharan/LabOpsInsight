<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Analyst Agent</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--text:#e6e8ee;--mute:#8b93a7;--accent:#6ea8fe;--ok:#4ade80;--err:#f87171;--code:#0b0d11}
@media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--panel:#fff;--line:#e2e5ec;--text:#161a22;--mute:#667085;--accent:#2563eb;--ok:#16a34a;--err:#dc2626;--code:#f1f3f7}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 16px 80px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.badge.demo{color:#f59e0b;border-color:#f59e0b}
form{display:flex;gap:8px;margin:18px 0 10px}
input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{padding:0 20px;border-radius:10px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{font-size:13px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--mute);cursor:pointer}
.chip:hover{color:var(--text)}
.step{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.step>summary{padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
.step>summary::-webkit-details-marker{display:none}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--code);color:var(--accent)}
.tag.err{color:var(--err)}
.sum{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-size:13px}
.spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.body{padding:0 14px 14px}
pre{margin:0;padding:12px;background:var(--code);border-radius:8px;overflow:auto;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.tbl{overflow:auto;max-height:260px;margin-top:10px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);color:var(--mute);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.fig{max-width:100%;border-radius:8px;margin-top:10px;border:1px solid var(--line);background:#fff}
.err-text{color:var(--err);margin-top:10px;font:12.5px ui-monospace,Menlo,monospace;white-space:pre-wrap}
.answer{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:16px 18px;margin-top:18px}
.answer h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.answer ul{padding-left:20px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;color:var(--mute);font-size:13px}
.stats b{color:var(--text)}
.banner{margin-top:14px;padding:10px 14px;border-radius:10px;border:1px solid var(--err);color:var(--err)}
</style>
</head>
<body>
<main>
  <header><h1>Autonomous Data Analyst</h1><span class="badge" id="model"></span><span class="badge" id="py"></span></header>
  <form id="f"><input id="q" maxlength="500" placeholder="Ask a business question about the shop data…" autofocus><button id="go">Analyze</button></form>
  <div class="chips" id="chips"></div>
  <div id="log" aria-live="polite"></div>
</main>
<script>
const $=s=>document.querySelector(s), log=$('#log');
const EXAMPLES=["Why did revenue drop in March 2025?","Which category generated the most revenue overall?","What was the average order value in February 2025?","What is the average customer satisfaction score by region?"];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let es=null, t0=0;

EXAMPLES.forEach(t=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t;b.onclick=()=>{$('#q').value=t;$('#f').requestSubmit()};$('#chips').append(b)});
fetch('/api/config').then(r=>r.json()).then(c=>{
  const m=$('#model');m.textContent=c.demo?'DEMO · scripted model, real queries':c.model;if(c.demo)m.classList.add('demo');
  $('#py').textContent=c.python?'python sandbox on':'python sandbox off'});

function table(text){
  const lines=text.split('\n').filter(l=>l.includes(' | '));
  if(lines.length<1) return `<pre>${esc(text)}</pre>`;
  const rows=lines.map(l=>l.split(' | ')), [h,...r]=rows, extra=text.split('\n').filter(l=>l.startsWith('...')||l.startsWith('(0'));
  return `<div class="tbl"><table><thead><tr>${h.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${
    r.map(row=>`<tr>${row.map(c=>`<td class="${/^-?[\d.,]+$/.test(c)?'n':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`+
    extra.map(e=>`<div class="sum" style="padding:6px 2px">${esc(e)}</div>`).join('');
}
function md(s){
  let h=esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
  return h.split(/\n{2,}/).map(p=>/^\s*- /m.test(p)?'<ul>'+p.split('\n').filter(x=>x.trim()).map(x=>`<li>${x.replace(/^\s*- /,'')}</li>`).join('')+'</ul>':`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
}
function addStep(ev){
  const d=document.createElement('details');d.className='step';d.open=true;
  const code=ev.input.sql||ev.input.code||'';
  const label={get_schema:'Schema',run_sql:'SQL',run_python:'Python'}[ev.name]||ev.name;
  d.innerHTML=`<summary><span class="tag">${label}</span><span class="sum">${esc(code.split('\n')[0]||'inspect tables')}</span><span class="spin"></span></summary><div class="body">${code?`<pre>${esc(code)}</pre>`:''}<div class="res"></div></div>`;
  log.append(d);d.scrollIntoView({block:'nearest'});return d;
}
function finishStep(d,ev){
  d.querySelector('.spin').remove();
  const res=d.querySelector('.res');
  if(ev.is_error){d.querySelector('.tag').classList.add('err');res.innerHTML=`<div class="err-text">${esc(ev.text)}</div>`;return}
  res.innerHTML=ev.name==='run_sql'?table(ev.text):`<pre>${esc(ev.text)}</pre>`;
  (ev.files||[]).filter(f=>f.endsWith('.png')).forEach(f=>res.insertAdjacentHTML('beforeend',`<img class="fig" src="/artifacts/${encodeURIComponent(f)}" alt="chart">`));
  if(ev.name!=='get_schema') d.open=true; else d.open=false;
}
$('#f').onsubmit=e=>{
  e.preventDefault();const q=$('#q').value.trim();if(!q)return;
  if(es)es.close();log.innerHTML='';$('#go').disabled=true;t0=performance.now();
  let cur=null;
  es=new EventSource('/api/ask?q='+encodeURIComponent(q));
  const end=()=>{es.close();$('#go').disabled=false};
  es.onmessage=m=>{const ev=JSON.parse(m.data);
    if(ev.kind==='tool_call')cur=addStep(ev);
    else if(ev.kind==='tool_result'&&cur)finishStep(cur,ev);
    else if(ev.kind==='answer'){log.insertAdjacentHTML('beforeend',`<section class="answer"><h2>Answer</h2>${md(ev.text)}</section>`)}
    else if(ev.kind==='stopped'){log.insertAdjacentHTML('beforeend',`<div class="banner">Stopped early: ${esc(ev.reason)} limit reached. The agent did not finish.</div>`)}
    else if(ev.kind==='error'){log.insertAdjacentHTML('beforeend',`<div class="banner">${esc(ev.message)}</div>`);end()}
    else if(ev.kind==='done'){
      log.insertAdjacentHTML('beforeend',`<div class="stats"><span><b>${((performance.now()-t0)/1000).toFixed(1)}s</b> elapsed</span><span><b>${ev.steps}</b> steps</span><span><b>${ev.sql_calls}</b> SQL (${ev.sql_errors} errors)</span><span><b>${ev.python_calls}</b> Python</span><span><b>${(ev.in_tok+ev.out_tok).toLocaleString()}</b> tokens</span></div>`);end()}
  };
  es.onerror=()=>{if($('#go').disabled){log.insertAdjacentHTML('beforeend','<div class="banner">Connection lost or server busy.</div>');end()}};
};
</script>
</body>
</html>
